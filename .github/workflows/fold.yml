name: Piko Fold

on:
  workflow_dispatch:
  push:
    branches: [main, codex/fold-landscape, codex/fold-v2, codex/fold-v3]

permissions:
  contents: write

concurrency:
  group: fold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew buildAndroid :patches:generatePatchesList --no-daemon
      - name: Verify Fold geometry
        run: |
          mkdir -p .test-fold
          javac -d .test-fold extensions/twitter/src/main/java/app/morphe/extension/twitter/patches/fold/FoldGeometry.java tests/FoldGeometryTest.java
          java -cp .test-fold FoldGeometryTest
      - name: Verify native Android layout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:twitter:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fold-test-results
          path: extensions/twitter/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: piko-fold-bundle
          path: patches/build/libs/*.mpp
          if-no-files-found: error
      - name: Prepare Morphe source
        if: github.ref == 'refs/heads/main'
        run: python3 .github/scripts/fold_release.py
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^version = //p' gradle.properties)
          gh release create "v$version" "patches/build/libs/patches-$version.mpp" patches-bundle.json patches-list.json SHA256SUMS --target "$GITHUB_SHA" --title "Piko Fold v$version" --notes-file docs/RELEASE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json patches-list.json
          git commit -m "chore: update Morphe source metadata [skip ci]"
          git push origin main
