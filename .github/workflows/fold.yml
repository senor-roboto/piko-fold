name: Piko Fold

on:
  workflow_dispatch:
  push:
    branches: [main, codex/fold-landscape]

permissions:
  contents: write

concurrency:
  group: fold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew buildAndroid --no-daemon
      - name: Verify Fold geometry
        run: |
          mkdir -p .test-fold
          javac -d .test-fold extensions/twitter/src/main/java/app/morphe/extension/twitter/patches/fold/FoldGeometry.java tests/FoldGeometryTest.java
          java -cp .test-fold FoldGeometryTest
      - name: Verify native Android layout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:twitter:testReleaseUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fold-test-results
          path: extensions/twitter/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: piko-fold-bundle
          path: patches/build/libs/*.mpp
          if-no-files-found: error
